  <circle cx="256" cy="256" r="134" fill="#fafafc" stroke="#1d1d1f" stroke-width="26" />
  <circle cx="256" cy="256" r="118" stroke="#d6d6d6" stroke-width="3" />

  <!-- Dual-Tone Magnified "Z" inside the Lens (#1d1d1f Ink + #0071e3 Pricing Blue) -->
  <path d="M196 196H306L200 316H196V290L264 214H196V196Z" fill="#1d1d1f" />
  <path d="M316 196V222L248 298H316V316H206L312 196H316Z" fill="#0071e3" />

  <!-- Precision Pointer Cursor clicking bottom-right corner handle -->
