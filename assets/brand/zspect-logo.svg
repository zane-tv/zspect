<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Tactile Apple Gallery White squircle surface -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="#ffffff" stroke="#d6d6d6" stroke-width="6" />

  <!-- Subtle inner grid lines inside inspector lens -->
  <line x1="156" y1="256" x2="356" y2="256" stroke="#e6e6e8" stroke-width="4" />
  <line x1="256" y1="156" x2="256" y2="356" stroke="#e6e6e8" stroke-width="4" />

  <!-- Apple Blue (#0071e3) UI Inspector Selection Bounding Box -->
  <rect x="122" y="122" width="268" height="268" stroke="#0071e3" stroke-width="14" />

  <!-- 4 Corner Resize Handles (□) -->
  <rect x="102" y="102" width="40" height="40" rx="8" fill="#ffffff" stroke="#0071e3" stroke-width="12" />
  <rect x="370" y="102" width="40" height="40" rx="8" fill="#ffffff" stroke="#0071e3" stroke-width="12" />
  <rect x="102" y="370" width="40" height="40" rx="8" fill="#ffffff" stroke="#0071e3" stroke-width="12" />
  <rect x="370" y="370" width="40" height="40" rx="8" fill="#ffffff" stroke="#0071e3" stroke-width="12" />

